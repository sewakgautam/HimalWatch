name: Weekly extraction pipeline

# Runs the full pipeline (reference data -> extraction -> static bundle)
# and deploys the result to Firebase Hosting. See
# docs/HIMALWATCH_SPEC.md §7.
#
# Scheduled Sundays 03:00 UTC (~08:45 Kathmandu Monday morning), plus
# manual dispatch with basin/year overrides for testing or an ad-hoc
# refresh.
#
# IMPORTANT — currently runs extract-lakes/extract-glaciers with
# --dry-run: build_composite() (extract/lakes.py and extract/glaciers.py)
# is a documented NotImplementedError stub — the real Sentinel-2 band
# download against Copernicus Data Space needs a human to wire up and
# verify against their own CDSE entitlement (see those modules'
# docstrings). Without --dry-run this job would fail on every single
# run. Once that's implemented, drop --dry-run below — until then, this
# keeps the weekly job green and exercising the rest of the pipeline
# (reference data freshness, the static bundle builder, the Firebase
# deploy) against synthetic data instead of doing nothing at all.
on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      basin:
        description: "Basin id to extract, or 'all' for every basin"
        required: false
        default: "all"
        type: choice
        options: [all, koshi, gandaki, karnali, mahakali]
      year:
        description: "Extraction year (blank = current year)"
        required: false
        type: string

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
      COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve basin/year inputs
        id: vars
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR="$(date +%Y)"
          fi
          # Scheduled runs have no `inputs.basin` at all (empty string) —
          # same as an explicit "all" dispatch: cover every basin, not
          # just koshi. A manual dispatch naming one specific basin
          # extracts just that one, for faster testing.
          BASIN_INPUT="${{ github.event.inputs.basin }}"
          if [ -z "$BASIN_INPUT" ] || [ "$BASIN_INPUT" = "all" ]; then
            BASINS="koshi gandaki karnali mahakali"
          else
            BASINS="$BASIN_INPUT"
          fi
          echo "basins=$BASINS" >> "$GITHUB_OUTPUT"
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"

      # No `python-version:` input — astral-sh/setup-uv only installs the
      # uv binary itself; it has no such input at all (GitHub Actions
      # warned "Unexpected input(s) 'python-version'" when this was set).
      # The actual Python version comes from packages/pipeline's own
      # .python-version / pyproject.toml `requires-python`, which `uv
      # sync` reads and downloads a matching interpreter for automatically.
      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      # No `version:` input here — pnpm/action-setup reads it from
      # package.json's "packageManager" field (pnpm@12.4.1). Setting it in
      # both places is a hard error: the action refuses to guess which one
      # wins.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install tippecanoe
        run: sudo apt-get update -y && sudo apt-get install -y tippecanoe

      - run: pnpm install --frozen-lockfile

      - name: Sync pipeline dependencies
        working-directory: packages/pipeline
        run: uv sync

      - run: pnpm --filter @himalwatch/schema build

      # `pnpm run`, not bare `pnpm pipeline` — this pnpm version (12.x)
      # reserves the bare word "pipeline" for its own pipelines feature
      # (pnpm-workspace.yaml's `pipelines:` key) and errors with
      # ERR_PNPM_NO_PIPELINES if none is declared there, rather than
      # falling through to the "pipeline" script in package.json. Hit
      # this same thing locally — same fix.
      #
      # Must run before everything else pipeline-related: this is a bare
      # checkout, so without pulling prior years back from the live site
      # first, every run would only ever know about the year it extracts
      # *this* time — history wouldn't accumulate, it'd just get
      # overwritten. See build/restore_history.py's docstring.
      - name: Restore prior years' data from the live site
        run: pnpm run pipeline restore-history

      - name: Load reference data (idempotent — skips if <30 days old)
        run: pnpm run pipeline load

      # See the NotImplementedError note at the top of this file re: --dry-run.
      - name: Extract lakes
        run: |
          for basin in ${{ steps.vars.outputs.basins }}; do
            echo "::group::Extract lakes — $basin"
            pnpm run pipeline extract-lakes --basin "$basin" --year ${{ steps.vars.outputs.year }} --dry-run
            echo "::endgroup::"
          done

      - name: Extract glaciers
        run: |
          for basin in ${{ steps.vars.outputs.basins }}; do
            echo "::group::Extract glaciers — $basin"
            pnpm run pipeline extract-glaciers --basin "$basin" --year ${{ steps.vars.outputs.year }} --dry-run
            echo "::endgroup::"
          done

      - name: Build static bundle
        run: pnpm run pipeline build-static

      - name: Build web portal
        run: pnpm --filter @himalwatch/web build

      # `firebase deploy --token` (from `firebase login:ci`) is dead —
      # Firebase deprecated CI-token auth and firebase-tools 15.x no
      # longer accepts it at all ("Failed to authenticate" even with a
      # valid token). The supported replacement is a service account key:
      # this action authenticates with GOOGLE_APPLICATION_CREDENTIALS
      # under the hood instead. See README.md for how to generate
      # FIREBASE_SERVICE_ACCOUNT.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: himalwatchnp
          channelId: live
