[project]
name = "himalwatch-pipeline"
version = "0.1.0"
description = "HimalWatch Sentinel-2 extraction pipeline and static bundle builder"
requires-python = ">=3.11"
dependencies = [
  "earthengine-api>=1.0.0",
  "rasterio>=1.3.10",
  "geopandas>=1.0.1",
  "shapely>=2.0.6",
  "pysheds>=0.4",
  "pystac-client>=0.8.3",
  "requests>=2.32.3",
  "pydantic>=2.9.2",
  "typer>=0.12.5",
  "scikit-image>=0.24.0",
  "python-dotenv>=1.0.1",
  "osmnx>=1.9.4",
]

[project.scripts]
himalwatch-pipeline = "himalwatch_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/himalwatch_pipeline"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
